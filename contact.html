<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Database Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">Database Learning Hub</h1>
        <ul class="flex space-x-6">
            <li><a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a></li>
            <li><a href="courses.html" class="text-gray-600 hover:text-blue-600">Courses</a></li>
            <li><a href="about.html" class="text-gray-600 hover:text-blue-600">About</a></li>
            <li><a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a></li>
        </ul>
    </nav>
    
    <!-- Contact Section -->
    <section class="py-16 px-6 text-center">
        <h2 class="text-3xl font-bold text-gray-800">Contact Us</h2>
        <p class="text-gray-600 mt-4">Have any questions? Reach out to us!</p>
        <form class="mt-6 max-w-md mx-auto">
            <input type="text" placeholder="Your Name" class="w-full px-4 py-2 border rounded-lg mb-4">
            <input type="email" placeholder="Your Email" class="w-full px-4 py-2 border rounded-lg mb-4">
            <textarea placeholder="Your Message" class="w-full px-4 py-2 border rounded-lg mb-4"></textarea>
            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700">Send Message</button>
        </form>
    </section>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6">
        <p>&copy; 2025 Database Learning Hub. All Rights Reserved.</p>
    </footer>
</body>
</html>
